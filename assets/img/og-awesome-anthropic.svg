<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Anthropic</title>
  <desc id="desc">Daily-updated Anthropic and Claude resource hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413"/>
      <stop offset="58%" stop-color="#2f211b"/>
      <stop offset="100%" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="220" fill="#f4f3ee" fill-opacity="0.07"/>
  <circle cx="130" cy="560" r="180" fill="#f4f3ee" fill-opacity="0.05"/>
  <circle cx="920" cy="520" r="150" fill="#f4f3ee" fill-opacity="0.04"/>

  <rect x="70" y="68" width="1060" height="494" rx="30" fill="url(#card)" stroke="#f4f3ee" stroke-opacity="0.16"/>

  <text x="110" y="150" fill="#d7c6b7" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="5">DAILY-UPDATED RESOURCE HUB</text>
  <text x="110" y="240" fill="#faf9f5" font-family="Georgia, serif" font-size="74" font-weight="700">Awesome Anthropic</text>
  <text x="110" y="300" fill="#f4f3ee" font-family="Arial, sans-serif" font-size="32">Claude models, SDKs, MCP, research, changelog, and community signals.</text>

  <rect x="110" y="350" width="284" height="110" rx="20" fill="#f4f3ee" fill-opacity="0.1" stroke="#f4f3ee" stroke-opacity="0.14"/>
  <rect x="414" y="350" width="284" height="110" rx="20" fill="#f4f3ee" fill-opacity="0.1" stroke="#f4f3ee" stroke-opacity="0.14"/>
  <rect x="718" y="350" width="372" height="110" rx="20" fill="#f4f3ee" fill-opacity="0.1" stroke="#f4f3ee" stroke-opacity="0.14"/>

  <text x="136" y="392" fill="#f0c4a0" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">TRACK</text>
  <text x="136" y="434" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Release notes</text>

  <text x="440" y="392" fill="#f0c4a0" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CURATE</text>
  <text x="440" y="434" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Best tools</text>

  <text x="744" y="392" fill="#f0c4a0" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FOLLOW</text>
  <text x="744" y="434" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">News and community buzz</text>

  <text x="110" y="515" fill="#f4f3ee" font-family="Arial, sans-serif" font-size="28">github.com/Omrigotlieb/awesome-anthropic</text>
  <text x="110" y="555" fill="#f0c4a0" font-family="Arial, sans-serif" font-size="22">Star the repo to follow daily Anthropic ecosystem updates.</text>
</svg>
