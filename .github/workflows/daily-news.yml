name: Daily News Fetch

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    name: Fetch & Inject Daily News
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js (for Claude CLI summarization)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Authenticate Claude CLI with Max subscription
        # Set CLAUDE_CREDENTIALS secret to the contents of ~/.claude/credentials.json
        # Refresh credentials: close Claude Code → open terminal → run `claude` → re-add secret
        if: ${{ secrets.CLAUDE_CREDENTIALS != '' }}
        run: |
          mkdir -p ~/.claude
          echo '${{ secrets.CLAUDE_CREDENTIALS }}' > ~/.claude/credentials.json

      - name: Fetch news from all sources
        run: python scripts/fetch_news.py

      - name: Generate daily digest
        run: python scripts/generate_digest.py

      - name: Inject digest into README
        run: python scripts/update_readme.py --section NEWS

      - name: Commit and push if changes
        run: |
          git config user.name "awesome-anthropic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/NEWS.md README.md data/last_news_fetch.json
          git diff --staged --quiet || git commit -m "chore(bot): daily news update $(date -u +%Y-%m-%d)"
          git push

      - name: Write job summary
        if: always()
        run: |
          echo "## Daily News — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          python scripts/fetch_news.py --summary 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
