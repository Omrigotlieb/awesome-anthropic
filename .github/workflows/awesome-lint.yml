name: Awesome Lint

on:
  push:
    branches: [main]
    paths: ['README.md']
  pull_request:
    paths: ['README.md']

permissions:
  contents: read

jobs:
  awesome-lint:
    name: Validate Awesome Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run awesome-lint
        run: npx --yes awesome-lint
