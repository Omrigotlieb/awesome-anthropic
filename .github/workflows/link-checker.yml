name: Link Checker

on:
  schedule:
    - cron: '0 9 * * 1'  # 09:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    name: Check All Links
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run link checker
        id: link_check
        run: |
          python scripts/link_checker.py --output /tmp/broken_links.txt
          COUNT=$(wc -l < /tmp/broken_links.txt 2>/dev/null || echo "0")
          echo "broken_count=$COUNT" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create issue for broken links
        if: steps.link_check.outputs.broken_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let brokenLinks = '';
            try {
              brokenLinks = fs.readFileSync('/tmp/broken_links.txt', 'utf8').trim();
            } catch (e) {
              brokenLinks = 'Could not read broken links file.';
            }
            if (!brokenLinks) return;

            // Check for existing open broken-link issues to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-link',
              state: 'open',
            });
            if (existing.data.length > 0) {
              console.log('Existing broken link issue found, skipping creation.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Link Check: ${process.env.BROKEN_COUNT} broken link(s) found`,
              body: `## Broken Links Report\n\n**Date:** ${new Date().toISOString().split('T')[0]}\n\n\`\`\`\n${brokenLinks}\n\`\`\`\n\nPlease fix or remove these links. If a link redirects correctly, it can be updated to the final URL.`,
              labels: ['broken-link', 'automated'],
            });
        env:
          BROKEN_COUNT: ${{ steps.link_check.outputs.broken_count }}

      - name: Write job summary
        if: always()
        run: |
          echo "## Link Check Results" >> $GITHUB_STEP_SUMMARY
          echo "**Broken links found:** ${{ steps.link_check.outputs.broken_count }}" >> $GITHUB_STEP_SUMMARY
